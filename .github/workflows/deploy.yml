name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:          # check the site on pull requests, without publishing it
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Skip publishing until GitHub Pages is set up for this repo with
  # Settings → Pages → Source: "GitHub Actions".
  check-pages:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null); then
            if [ "$build_type" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            msg="GitHub Pages is set to deploy from a branch. Change Settings → Pages → Source to \"GitHub Actions\" to publish the tools."
          else
            msg="GitHub Pages is not set up for this repository, so the tools are not published. Enable it in Settings → Pages → Source: \"GitHub Actions\"."
          fi
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice title=Site not published::$msg"
          echo "### Site not published" >> "$GITHUB_STEP_SUMMARY"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  # No build step: collect the files the pages need, check them, and package them.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Everything except development material: original logo sources, the
      # sample banner, scripts, docs and repository files. New tool folders are
      # picked up automatically.
      - name: Collect site files
        run: |
          rsync -a \
            --exclude '.git*' --exclude '_site' \
            --exclude 'sample/' --exclude 'scripts/' \
            --exclude '*.ai' --exclude '*.eps' \
            --exclude '*.md' --exclude '.DS_Store' \
            ./ _site/
          echo "### Published files" >> "$GITHUB_STEP_SUMMARY"
          (cd _site && find . -type f | sort | sed 's/^\.\//- /') >> "$GITHUB_STEP_SUMMARY"

      - name: Check links and assets
        run: python3 scripts/check_site.py _site

      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: [check-pages, build]
    if: needs.check-pages.outputs.enabled == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
